<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>body{margin:0;width:200px;padding:12px;font-family:sans-serif;font-size:13px;color:#555}</style></head>
<body>
<p>正在打开 Veil 侧边栏…</p>
<script>
chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
  const tabId = tabs[0]?.id
  if (!tabId) { document.querySelector('p').textContent = '无法获取当前标签页'; return }
  chrome.sidePanel.open({ tabId }, () => {
    if (chrome.runtime.lastError) {
      document.querySelector('p').textContent = '错误: ' + chrome.runtime.lastError.message
    } else {
      window.close()
    }
  })
})
</script>
</body>
</html>
